name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push supersedes the run still going for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows is not redundant here: player-libs.test.js compares the committed
    # bundles under renderer/lib byte for byte against the installed packages,
    # and only a Windows checkout exercises the line-ending conversion that
    # .gitattributes exists to prevent.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test
