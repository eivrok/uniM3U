name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push supersedes the run still going for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Windows is not redundant here: player-libs.test.js compares the committed
    # bundles under renderer/lib byte for byte against the installed packages,
    # and only a Windows checkout exercises the line-ending conversion that
    # .gitattributes exists to prevent.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test
