name: Release

# Push a tag like v1.0.0 to build installers for all three platforms and
# upload them to a GitHub Release (created as a draft — publish it manually).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create/upload the GitHub Release

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      # electron-builder builds the host OS target (mac=dmg, win=nsis,
      # linux=AppImage) and uploads to the release for this tag.
      - name: Build and publish
        run: npm run build -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
