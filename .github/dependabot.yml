version: 2
updates:
  # npm dependencies (Electron app + tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Bundle low-risk dev tooling bumps into one PR
      dev-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 10

  # Keep GitHub Actions in release.yml current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
